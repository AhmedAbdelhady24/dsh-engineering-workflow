      <text x="85" y="17" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10" font-weight="700">🔒 READ-ONLY AUDIT</text>
    </g>
  </g>

  <!-- Arrow 3 -> 4 -->
