    <text x="42" y="30" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">STAGE 3</text>
    <text x="14" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">review</text>
