    <rect x="14" y="16" width="56" height="20" rx="10" fill="#0369a1" fill-opacity="0.4"/>
    <text x="42" y="30" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">STAGE 1</text>
