    <text x="42" y="30" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700">STAGE 2</text>
    <text x="14" y="62" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="20" font-weight="700">execute</text>
    <text x="14" y="80" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Implementation &amp; TDD</text>
