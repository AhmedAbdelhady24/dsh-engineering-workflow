  <g transform="translate(60, 484)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11.5">
    <rect width="140" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
