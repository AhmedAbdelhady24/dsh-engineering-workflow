    <text x="14" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• WCAG 2.2 AA a11y</text>
    <text x="14" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• UX tech architecture</text>
    <text x="14" y="182" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Optional [focus] mode</text>
    <g transform="translate(14, 198)">
