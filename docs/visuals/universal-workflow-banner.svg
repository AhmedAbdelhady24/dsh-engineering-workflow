    <text x="14" y="116" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Repo &amp; branch inspection</text>
    <text x="14" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Skill &amp; MCP readiness</text>
    <text x="14" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Standards proposal</text>
    <text x="14" y="182" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Initial plan &amp; risks</text>
    <g transform="translate(14, 198)">
