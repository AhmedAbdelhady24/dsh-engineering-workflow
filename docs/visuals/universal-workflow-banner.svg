    <text x="14" y="138" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Severity taxonomy</text>
    <text x="14" y="160" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• File:line citations</text>
    <text x="14" y="182" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11.5">• Zero code mutations</text>
