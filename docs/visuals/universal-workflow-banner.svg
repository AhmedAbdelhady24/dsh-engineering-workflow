    </g>

    <g transform="translate(330, 0)">
      <rect width="150" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="0.8"/>
      <text x="75" y="16" text-anchor="middle" fill="#34d399">Tests: Automated ✓</text>
    </g>
  </g>

  <text x="1140" y="500" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">github.com/AhmedAbdelhady24/dsh-engineering-workflow</text>
