<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Universal Engineering Workflow Specification</title>
  <desc id="heroDesc">Portable, production-quality Agent Skills workflow supporting setup, execute, review, and ux-audit operations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#090e1a"/>
    </linearGradient>
    <linearGradient id="stage1-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2340"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="stage2-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1845"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="stage3-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a3228"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <linearGradient id="stage4-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2308"/>
      <stop offset="100%" stop-color="#0b1728"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="540" rx="24" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Ambient Glows -->
  <circle cx="1060" cy="80" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow-cyan)"/>
  <circle cx="150" cy="460" r="170" fill="#818cf8" opacity="0.07" filter="url(#glow-purple)"/>
  <circle cx="600" cy="500" r="150" fill="#34d399" opacity="0.06" filter="url(#glow-cyan)"/>

  <!-- Top Pill -->
  <g transform="translate(60, 32)">
    <rect width="280" height="26" rx="13" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="13" cy="13" r="4" fill="#38bdf8"/>
    <text x="24" y="17" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10.5" font-weight="600" letter-spacing="1.5">OPEN AGENT SKILLS SPEC · V1.0.0</text>
  </g>

  <!-- Header & Subtitle -->
  <text x="60" y="88" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.5">Universal Engineering Workflow</text>
  <text x="60" y="116" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">Disciplined multi-stage software delivery across leading autonomous coding agents</text>

  <!-- Platform Compatibility Badges -->
  <g transform="translate(60, 138)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12.5" font-weight="500">
    <g transform="translate(0, 0)">
      <rect width="144" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8"/>
      <text x="25" y="18.5" fill="#e2e8f0">Antigravity (IDE/CLI)</text>
    </g>
    <g transform="translate(154, 0)">
      <rect width="170" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#60a5fa"/>
      <text x="25" y="18.5" fill="#e2e8f0">DeepSeek Harness (DSH)</text>
    </g>
    <g transform="translate(334, 0)">
      <rect width="148" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#10b981"/>
      <text x="25" y="18.5" fill="#e2e8f0">OpenAI Codex (CLI)</text>
    </g>
    <g transform="translate(492, 0)">
      <rect width="134" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="14" cy="14" r="3.5" fill="#f59e0b"/>
      <text x="25" y="18.5" fill="#e2e8f0">Claude Code (CLI)</text>
    </g>
  </g>

