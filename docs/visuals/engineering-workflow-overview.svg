<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Engineering Workflow for DeepSeek Harness</title>
  <desc id="heroDesc">A visual overview showing the workflow, compaction, skills, and opt-in recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="430" rx="28" fill="url(#bg)"/>
  <circle cx="1010" cy="55" r="150" fill="#38bdf8" opacity="0.08" filter="url(#glow)"/>
  <circle cx="760" cy="390" r="180" fill="#34d399" opacity="0.07" filter="url(#glow)"/>

  <text x="64" y="82" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" letter-spacing="3">DEEPSEEK HARNESS · PRESET BUNDLE</text>
  <text x="64" y="146" fill="#f8fafc" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="54" font-weight="700">Engineering Workflow</text>
  <text x="64" y="198" fill="#cbd5e1" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25">Long coding tasks. Less context chaos.</text>

  <g transform="translate(64 250)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="168" height="46" rx="23" fill="#0f766e" opacity="0.55" stroke="#34d399" stroke-opacity="0.7"/>
    <text x="84" y="29" text-anchor="middle" fill="#d1fae5" font-size="16">22 standard tools</text>

    <rect x="184" width="168" height="46" rx="23" fill="#1e3a8a" opacity="0.55" stroke="#60a5fa" stroke-opacity="0.7"/>
    <text x="268" y="29" text-anchor="middle" fill="#dbeafe" font-size="16">2 bundled skills</text>

    <rect x="368" width="220" height="46" rx="23" fill="#78350f" opacity="0.55" stroke="#fbbf24" stroke-opacity="0.7"/>
    <text x="478" y="29" text-anchor="middle" fill="#fef3c7" font-size="16">opt-in recovery</text>
  </g>

  <g transform="translate(64 330)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16">
    <text x="0" y="0" fill="#94a3b8">Plan</text>
    <path d="M 45 -5 L 100 -5" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="112" y="0" fill="#94a3b8">Build</text>
    <path d="M 157 -5 L 212 -5" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="224" y="0" fill="#38bdf8">Compact</text>
    <path d="M 302 -5 L 357 -5" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="369" y="0" fill="#34d399">Resume</text>
  </g>

  <path d="M 690 72 H 1120" stroke="#334155" stroke-width="2" stroke-dasharray="4 7" opacity="0.8"/>
  <g transform="translate(720 100)" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <rect width="410" height="250" rx="20" fill="#0f172a" stroke="#334155"/>
    <text x="28" y="48" fill="#f8fafc" font-size="20" font-weight="600">What the preset changes</text>
    <text x="28" y="84" fill="#cbd5e1" font-size="16">✓ keeps all standard coding tools</text>
    <text x="28" y="116" fill="#cbd5e1" font-size="16">✓ adds the Engineering Workflow identity</text>
    <text x="28" y="148" fill="#cbd5e1" font-size="16">✓ compacts near 50% context pressure</text>
    <text x="28" y="180" fill="#cbd5e1" font-size="16">✓ loads two focused skills on demand</text>
    <text x="28" y="212" fill="#cbd5e1" font-size="16">✓ ships recovery disabled by default</text>
  </g>

  <text x="64" y="405" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">github.com/AhmedAbdelhady24/dsh-engineering-workflow</text>
  <rect x="690" y="380" width="430" height="2" rx="1" fill="url(#accent)" opacity="0.55"/>
</svg>
