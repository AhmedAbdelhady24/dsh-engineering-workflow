<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="auto" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Universal Engineering Workflow Specification</title>
  <desc id="heroDesc">Portable, production-quality Agent Skills workflow across Antigravity, DSH, Codex, and Claude Code.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0c1322"/>
      <stop offset="100%" stop-color="#0a101d"/>
    </linearGradient>
    <linearGradient id="accent-flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111c30"/>
      <stop offset="100%" stop-color="#0d1525"/>
    </linearGradient>
    <linearGradient id="stage1-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082f49" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stage2-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="stage3-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0b1728" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="520" rx="24" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Ambient Glows -->
  <circle cx="1020" cy="90" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow-cyan)"/>
  <circle cx="200" cy="450" r="160" fill="#818cf8" opacity="0.07" filter="url(#glow-purple)"/>
  <circle cx="680" cy="480" r="140" fill="#34d399" opacity="0.06" filter="url(#glow-cyan)"/>

  <!-- Top Pill / Standard Label -->
  <g transform="translate(60, 42)">
    <rect width="320" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="14" cy="14" r="4" fill="#38bdf8"/>
    <text x="26" y="19" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600" letter-spacing="1.5">OPEN AGENT SKILLS SPEC · V1.0.0</text>
  </g>

  <!-- Hero Header -->
  <text x="60" y="112" fill="#f8fafc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5">Universal Engineering Workflow</text>
  <text x="60" y="142" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">Disciplined multi-stage software delivery across leading autonomous coding agents</text>

  <!-- Platform Compatibility Badges -->
  <g transform="translate(60, 168)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500">
    <!-- Antigravity -->
    <g transform="translate(0, 0)">
      <rect width="138" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#38bdf8"/>
      <text x="28" y="20" fill="#e2e8f0">Antigravity (IDE/CLI)</text>
    </g>
    <!-- DeepSeek Harness -->
    <g transform="translate(148, 0)">
      <rect width="168" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#60a5fa"/>
      <text x="28" y="20" fill="#e2e8f0">DeepSeek Harness (DSH)</text>
    </g>
    <!-- OpenAI Codex -->
    <g transform="translate(326, 0)">
      <rect width="144" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#10b981"/>
      <text x="28" y="20" fill="#e2e8f0">OpenAI Codex (CLI)</text>
    </g>
    <!-- Claude Code -->
    <g transform="translate(480, 0)">
      <rect width="130" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="16" cy="15" r="4" fill="#f59e0b"/>
      <text x="28" y="20" fill="#e2e8f0">Claude Code (CLI)</text>
    </g>
  </g>

  <!-- LEFT SECTION: Three Core Operations Workflow Cards -->
  <g transform="translate(60, 222)">
    <!-- Section Sub-Header -->
    <text x="0" y="0" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="600" letter-spacing="1.5">THREE DISCIPLINED OPERATIONS</text>

    <!-- Stage 1: Setup Card -->
    <g transform="translate(0, 16)">
      <rect width="170" height="185" rx="14" fill="url(#stage1-grad)" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.2"/>
      <rect x="14" y="14" width="60" height="20" rx="10" fill="#0369a1" fill-opacity="0.4"/>
      <text x="44" y="28" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">STAGE 1</text>
      <text x="14" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">setup</text>
      <line x1="14" y1="70" x2="156" y2="70" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Repo discovery</text>
      <text x="14" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Skill &amp; MCP audit</text>
      <text x="14" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Standards proposal</text>
      <text x="14" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Initial plan</text>
      <g transform="translate(14, 162)">
        <text x="0" y="10" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🛑 APPROVAL GATE</text>
      </g>
    </g>

    <!-- Connecting Arrow 1 -> 2 -->
    <g transform="translate(178, 108)">
      <circle cx="13" cy="0" r="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <path d="M 9 -4 L 16 0 L 9 4" fill="none" stroke="#38bdf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 2: Execute Card -->
    <g transform="translate(212, 16)">
      <rect width="180" height="185" rx="14" fill="url(#stage2-grad)" stroke="#6366f1" stroke-opacity="0.5" stroke-width="1.2"/>
      <rect x="14" y="14" width="60" height="20" rx="10" fill="#4338ca" fill-opacity="0.4"/>
      <text x="44" y="28" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, monospace" font-size="10" font-weight="700">STAGE 2</text>
      <text x="14" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">execute</text>
      <line x1="14" y1="70" x2="166" y2="70" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="92" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Dynamic skill routing</text>
      <text x="14" y="112" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Proportional planning</text>
      <text x="14" y="132" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• TDD &amp; minimal diffs</text>
      <text x="14" y="152" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="12">• Single-writer safety</text>
      <g transform="translate(14, 162)">
        <text x="0" y="10" fill="#818cf8" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔄 REVIEW LOOP (≤ 3)</text>
      </g>
    </g>

    <!-- Connecting Arrow 2 -> 3 -->
    <g transform="translate(400, 108)">
      <circle cx="13" cy="0" r="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <path d="M 9 -4 L 16 0 L 9 4" fill="none" stroke="#818cf8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Stage 3: Review Card -->
    <g transform="translate(434, 16)">
      <rect width="170" height="185" rx="14" fill="url(#stage3-grad)" stroke="#10b981" stroke-opacity="0.5" stroke-width="1.2"/>
      <rect x="14" y="14" width="60" height="20" rx="10" fill="#047857" fill-opacity="0.4"/>
      <text x="44" y="28" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">STAGE 3</text>
      <text x="14" y="58" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">review</text>
      <line x1="14" y1="70" x2="156" y2="70" stroke="#1e293b" stroke-width="1"/>
      <text x="14" y="92" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Read-only verification</text>
      <text x="14" y="112" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Correctness &amp; security</text>
      <text x="14" y="132" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• Severity matrix</text>
      <text x="14" y="152" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">• File &amp; line citations</text>
      <g transform="translate(14, 162)">
        <text x="0" y="10" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="700">🔒 ZERO CODE MUTATION</text>
      </g>
    </g>
  </g>

  <!-- RIGHT SECTION: Canonical Architecture Invariants Card -->
  <g transform="translate(685, 90)">
    <rect width="455" height="338" rx="18" fill="url(#card-grad)" stroke="#334155" stroke-width="1.2"/>
    <path d="M 0 18 Q 0 0 18 0 L 437 0 Q 455 0 455 18 L 455 3 L 0 3 Z" fill="url(#accent-flow)"/>

    <text x="28" y="38" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Canonical Architecture Invariants</text>
    <text x="28" y="58" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Strict engineering standards across IDE and CLI runtimes</text>

    <!-- Checklist Items -->
    <g transform="translate(28, 86)" font-family="system-ui, sans-serif" font-size="13.5">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">One Canonical Spec:</text>
        <text x="175" y="0" fill="#94a3b8">Standard agentskills.io layout</text>
      </g>

      <!-- Item 2 -->
      <g transform="translate(0, 36)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">Dynamic Routing:</text>
        <text x="156" y="0" fill="#94a3b8">Context7, Chrome DevTools, TDD</text>
      </g>

      <!-- Item 3 -->
      <g transform="translate(0, 72)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">MCP Security:</text>
        <text x="135" y="0" fill="#94a3b8">Approval required for all tools &amp; MCPs</text>
      </g>

      <!-- Item 4 -->
      <g transform="translate(0, 108)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">Compaction Ledger:</text>
        <text x="172" y="0" fill="#94a3b8">Zero repeated work after compaction</text>
      </g>

      <!-- Item 5 -->
      <g transform="translate(0, 144)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">Strict Safety:</text>
        <text x="122" y="0" fill="#94a3b8">Single writer, no destructive Git verbs</text>
      </g>

      <!-- Item 6 -->
      <g transform="translate(0, 180)">
        <circle cx="9" cy="-4" r="9" fill="#0284c7" fill-opacity="0.25"/>
        <text x="9" y="0" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="700">✓</text>
        <text x="26" y="0" fill="#e2e8f0" font-weight="600">Bounded Loops:</text>
        <text x="144" y="0" fill="#94a3b8">Maximum 3 review cycles per task</text>
      </g>
    </g>

    <!-- Card Footer Badges -->
    <g transform="translate(28, 290)">
      <rect width="180" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="90" y="17" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">Spec: agentskills.io</text>

      <rect x="192" width="190" height="26" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="287" y="17" text-anchor="middle" fill="#34d399" font-family="ui-monospace, monospace" font-size="11">Automated Tests: 26/26 ✓</text>
    </g>
  </g>

  <!-- Bottom Metadata Bar -->
  <line x1="60" y1="465" x2="1140" y2="465" stroke="#1e293b" stroke-width="1"/>
  <text x="60" y="492" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">github.com/AhmedAbdelhady24/dsh-engineering-workflow</text>
  <text x="1140" y="492" text-anchor="end" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">Universal Agent Skill Package · Canonical Implementation</text>
</svg>
